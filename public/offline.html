<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — CALLBACX Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #94a3b8; margin-bottom: 24px; }
    button { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h1>You're offline</h1>
  <p>The CALLBACX Admin dashboard is not available without an internet connection.</p>
  <button onclick="window.location.reload()">Try again</button>
  <script>
    // Attempt to reconnect when back online
    if (navigator.onWindow) {
      window.addEventListener("online", () => window.location.reload());
    }
  </script>
</body>
</html>
